[project]
name = "simtools"
version = "0.1.0"
description = "fpvsim tools: config resolver, model compiler, launcher (simctl), analysis"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.3",
    "pydantic>=2.9",
    "pyyaml>=6",
    "scipy>=1.18.1",
    "trimesh>=5.1.0",
    "typer>=0.12",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "pyright>=1.1.390"]

[project.scripts]
simctl = "simtools.simctl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simtools"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a built Betaflight SITL binary"]
