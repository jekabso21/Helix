schema_version: 1
name: radiomaster_boxer
device:
  name_contains: "Radiomaster Boxer"
channels:
  roll:     { axis: 1 }
  pitch:    { axis: 2 }
  throttle: { axis: 0 }
  yaw:      { axis: 3 }
  aux1:     { button: 0 }                   # arm switch, radio channel 9; resting = disarmed
  aux2:     { axis: 4, inverted: true }     # switch SD, radio channel 5
arm_channel: aux1
