exclude: ^third_party/
repos:
  - repo: local
    hooks:
      - id: clang-format
        name: clang-format
        entry: clang-format -i
        language: system
        types_or: [c++, c]
      - id: ruff-check
        name: ruff check
        entry: uv run --project tools ruff check --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --project tools ruff format --force-exclude
        language: system
        types: [python]
      - id: tagged-todos
        name: TODOs must be tagged (verify, perf, later)
        entry: 'TODO(?!\((verify|perf|later)\):)'
        language: pygrep
        exclude: '(\.md$|^\.pre-commit-config\.yaml$)'
